name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - lecture-02-dynamics
      - lecture-04-dynamics
      - lecture-05-dynamics
      - lecture-06-dynamics
      - lecture-07-dynamics
      - lecture-hm1-1-1-3
      - lecture-hm1-1-1-2
      - lecture-hm1-1-1-1-1
      - lecture-03-dynamics
      - lecture-hm1-1-1-4
      - lecture-hm1-2-2-1
      - lecture-hm1-2-2-2
      - lecture-decomposition-presentation
      - lecture-hm1-2-2-3-1
      - lecture-scalar-product-angle-problems
      - lecture-vector-product
      - lecture-hm1-2-2-3-3
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
